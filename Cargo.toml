[package]
name = "squiddish"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1.9"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
lru = "0.12"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
pin-project = "1.1"

[dev-dependencies]
tempfile = "3.14"
reqwest = { version = "0.12", features = ["rustls-tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
